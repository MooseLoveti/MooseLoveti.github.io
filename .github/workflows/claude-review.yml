name: Claude review

# Reviews each PR once when it is opened. To review again after fixes,
# comment "@claude もう一度レビューして" on the PR.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

permissions: {}

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@6fed3ca145920b639991cb756090506e1bcaf515 # v1.0.245
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # PRs opened by Claude itself have the actor claude[bot].
          allowed_bots: claude
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            この PR をレビューしてください。対象は GitHub Pages で公開している静的サイト（index.html / style.css）です。

            確認する観点:
            1. 関連 issue（本文の "Closes #N"）の完了条件を満たしているか。`gh issue view` で確認する。
            2. issue の範囲外の変更が混ざっていないか。
            3. HTML の構造の誤り（閉じタグ、id の重複、ページ内リンク切れ）。
            4. レスポンシブ表示の崩れ（900px / 600px のブレークポイント）。
            5. アクセシビリティ（alt、見出し階層、コントラスト、リンクの rel）。
            6. CVE 番号・リンク・日付などの事実情報が意図せず変わっていないか。

            具体的な指摘はインラインコメントで、全体の所感と「マージしてよいか」の判断は `gh pr comment` で日本語で書いてください。
            問題がなければ、その旨を短く書くだけで構いません。
          claude_args: |
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"
